<html lang="es">

<title>Modelo de datos - an0010001_conc_transportes</title>

<style>

:root {
    --bg: #020817;
    --panel: #0b1220;
    --panel2: #111827;
    --border: #26344c;
    --text: #e7eef8;
    --muted: #8b9bb3;
    --cyan: #00d9ff;
    --green: #00d084;
    --purple: #9b7cff;
    --orange: #ff9f1c;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:
        radial-gradient(
            circle at 20% 10%,
            #0c1d3b 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #141936 0,
            transparent 30%
        ),
        var(--bg);
}

.app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 72px;
    min-height: 72px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(5, 11, 25, .88);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(15px);
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--cyan);
    border-radius: 10px;
    color: var(--cyan);
    box-shadow: 0 0 25px rgba(0,217,255,.12);
}

.title {
    font-size: 18px;
    font-weight: 750;
}

.subtitle {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
}

button:hover {
    background: var(--panel2);
    border-color: #53627b;
}

.workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    cursor: grab;
}

.viewport.dragging {
    cursor: grabbing;
}

#diagram {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    user-select: none;
}

.canvas-background {
    fill: #050b16;
}

.edge-line {
    fill: none;
    stroke: #64748b;
    stroke-width: 2;
}

.arrow-head {
    fill: #64748b;
}

.edge-label {
    fill: #aab7c9;
    font-size: 12px;
    font-weight: 650;
}

.node {
    cursor: pointer;
    outline: none;
}

.node-card {
    fill: #0d1626;
    stroke: #2a3851;
    stroke-width: 1.2;
}

.node:hover .node-card,
.node:focus .node-card {
    stroke: var(--cyan);
    stroke-width: 1.8;
}

.node-accent {
    fill: var(--cyan);
}

.node-process .node-accent {
    fill: var(--green);
}

.node-file .node-accent {
    fill: var(--purple);
}

.node-configuration .node-accent {
    fill: var(--orange);
}

.node-type {
    fill: #8da0ba;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
}

.node-label {
    fill: #f1f6ff;
    font-size: 16px;
    font-weight: 700;
}

.node-description {
    fill: #9eacc0;
    font-size: 11px;
}

.node-source {
    fill: #62728b;
    font-size: 9px;
}

.inspector {
    display: none;
    position: absolute;
    top: 20px;
    right: 20px;
    width: 330px;
    max-height: calc(100% - 40px);
    overflow: auto;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(8,15,29,.95);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    z-index: 10;
}

.inspector.visible {
    display: block;
}

.inspector-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.inspector h2 {
    margin: 0;
    font-size: 16px;
}

.field {
    margin-top: 16px;
}

.field-label {
    color: #70819b;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.field-value {
    margin-top: 5px;
    font-size: 13px;
    line-height: 1.45;
    overflow-wrap: anywhere;
}

.legend,
.zoom {
    position: absolute;
    bottom: 18px;
    z-index: 10;
}

.legend {
    left: 18px;
    display: flex;
    gap: 14px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(7,14,27,.88);
    color: var(--muted);
    font-size: 11px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.dot-table {
    background: var(--cyan);
}

.dot-process {
    background: var(--green);
}

.dot-file {
    background: var(--purple);
}

.dot-configuration {
    background: var(--orange);
}

.zoom {
    right: 18px;
    display: flex;
    gap: 5px;
}

.zoom button {
    width: 36px;
    height: 36px;
    padding: 0;
}

.light {
    --bg: #f4f7fb;
    --panel: #fff;
    --panel2: #eef2f8;
    --border: #d6deea;
    --text: #172033;
    --muted: #65728a;
}

.light .header {
    background: rgba(255,255,255,.9);
}

.light .canvas-background {
    fill: #f7f9fc;
}

.light .node-card {
    fill: #fff;
    stroke: #ccd6e4;
}

.light .node-label {
    fill: #182235;
}

</style>
</head>

<script>

const viewport = document.getElementById("viewport");
const diagram = document.getElementById("diagram");
const inspector = document.getElementById("inspector");

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let dragging = false;
let startX = 0;
let startY = 0;


function renderTransform() {
    diagram.style.transform =
        `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}


function zoomAt(factor, clientX, clientY) {
    const oldScale = scale;
    const newScale = Math.min(
        2.5,
        Math.max(.25, scale * factor)
    );

    const rect = viewport.getBoundingClientRect();

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    offsetX = x - (x - offsetX) * (newScale / oldScale);
    offsetY = y - (y - offsetY) * (newScale / oldScale);

    scale = newScale;

    renderTransform();
}


viewport.addEventListener("mousedown", (event) => {
    if (event.target.closest(".node")) {
        return;
    }

    dragging = true;
    viewport.classList.add("dragging");

    startX = event.clientX - offsetX;
    startY = event.clientY - offsetY;
});


window.addEventListener("mousemove", (event) => {
    if (!dragging) {
        return;
    }

    offsetX = event.clientX - startX;
    offsetY = event.clientY - startY;

    renderTransform();
});


window.addEventListener("mouseup", () => {
    dragging = false;
    viewport.classList.remove("dragging");
});


viewport.addEventListener("wheel", (event) => {
    event.preventDefault();

    zoomAt(
        event.deltaY < 0 ? 1.1 : .9,
        event.clientX,
        event.clientY
    );
}, { passive: false });


document.querySelectorAll(".node").forEach((node) => {
    node.addEventListener("click", (event) => {
        event.stopPropagation();

        document.getElementById("inspector-title").textContent =
            node.dataset.label;

        document.getElementById("inspector-type").textContent =
            node.dataset.type;

        document.getElementById("inspector-description").textContent =
            node.dataset.description || "Sin descripción";

        document.getElementById("inspector-source").textContent =
            node.dataset.source || "Sin fuente de información";

        inspector.classList.add("visible");
    });
});


document.getElementById("close-inspector").addEventListener(
    "click",
    () => inspector.classList.remove("visible")
);


document.getElementById("zoom-in").addEventListener("click", () => {
    zoomAt(1.15, innerWidth / 2, innerHeight / 2);
});


document.getElementById("zoom-out").addEventListener("click", () => {
    zoomAt(.87, innerWidth / 2, innerHeight / 2);
});


document.getElementById("reset-view").addEventListener("click", () => {
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    renderTransform();
});


document.getElementById("theme").addEventListener("click", () => {
    document.body.classList.toggle("light");

    document.getElementById("theme").textContent =
        document.body.classList.contains("light")
            ? "Dark"
            : "Light";
});


document.getElementById("export-svg").addEventListener("click", () => {
    const svg = document.getElementById("diagram");

    const source = new XMLSerializer()
        .serializeToString(svg);

    const blob = new Blob(
        [source],
        { type: "image/svg+xml;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "architecture.svg";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
});


renderTransform();

</script>
